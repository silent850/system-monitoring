name: Mirror 
smartmonitorsoftware

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout system-monitoring
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove existing files
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

      - name: Clone monitoringtool
        run: |
          https://github.com/kariashangati/smartmonitorsoftware.git

      - name: Copy 
smartmonitorsoftware files
        run: |
          rsync -av source/ . \
            --exclude .git

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A

          git commit -m "Mirror 
smartmonitorsoftware" || echo "No changes"

          git push
